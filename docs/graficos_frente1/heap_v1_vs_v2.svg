<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Heap: código bruto da IA (v1) × refatorado (v2)" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
